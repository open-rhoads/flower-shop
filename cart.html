
<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Once and Floral - Cart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"

<body>
  <div class="container" id="top">
    <header class="row">
              <nav class="navbar navbar-expand-lg bg-light">
          <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-flower2"></i> Once and Floral</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse p-3" id="navbarContent">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                </li>
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" href="products.html" id="navbarDropdown" role="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    Products
                  </a>
                  <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                    <li><a class="dropdown-item" href="products.html#flowers">Flowers</a></li>
                    <li><a class="dropdown-item" href="products.html#succulents">Succulents & Cacti</a></li>
                    <li><a class="dropdown-item" href="products.html#tools">Trees and Bushes</a></li>
                  </ul>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="contact.html">Contact Us</a>
                </li>
              </ul>

              <form class="d-flex" role="search">
                <a href="cart.html" class="m-3 nav-link">
                  <i class="bi bi-cart3 me-2"></i>
                  <span id="cart-count" class="position-absolute end-25 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
                <input class="form-control m-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-dark m-2" type="submit">Submit</button>
              </form>
            </div>
          </div>
        </nav>
    </header>
    <main class="row">
      <div class="col-12">
        <h1>Your Cart</h1>
        <div id="cart-items" class="d-flex justify-content-stretch">
          <!-- cart renders dynamically via JS here -->
        </div>
      </div>
      <div class="col-4">
        <h2 id="cart-total">Total: $0.00</h2>
        <button class="btn" id="checkout-btn">Checkout</button>
      </div>
    </main>
    <hr class="featurette-divider">
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">

      <a href="/" class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-dark text-decoration-none">
